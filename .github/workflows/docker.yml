name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: debian
            base: node:24-bookworm-slim
            suffix: ''
          - name: alpine
            base: node:24-alpine
            suffix: '-alpine'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest${{ matrix.variant.suffix }}
            type=sha,prefix=sha-,suffix=${{ matrix.variant.suffix }}
            type=semver,pattern={{version}},suffix=${{ matrix.variant.suffix }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ matrix.variant.base }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start with Docker Compose
        run: |
          cat > .env <<'EOF'
          APP_SECRET=compose-smoke-secret-0123456789abcdef0123456789abcdef
          PUBLIC_BASE_URL=http://127.0.0.1:8787
          NODE_ENV=development
          DATA_DIR=./data
          DATABASE_PATH=./data/steam-monitor.db
          EOF
          docker compose up -d --build
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              echo "health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "health check failed"
          docker compose logs --no-color
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  alpine-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Alpine image
        run: docker build --build-arg BASE_IMAGE=node:24-alpine -t steam-monitor:alpine .

      - name: Run Alpine image and check health
        run: |
          docker run -d --name steam-monitor-alpine \
            -e APP_SECRET=alpine-smoke-secret-0123456789abcdef0123456789abcdef \
            -e NODE_ENV=production \
            -e PUBLIC_BASE_URL=http://127.0.0.1:8787 \
            -p 8787:8787 \
            steam-monitor:alpine
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              echo "alpine health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "alpine health check failed"
          docker logs steam-monitor-alpine
          exit 1

      - name: Remove Alpine container
        if: always()
        run: docker rm -f steam-monitor-alpine || true

  standalone-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone image
        run: docker build -t steam-monitor:standalone .

      - name: Run with host-style relative .env paths
        run: |
          cat > /tmp/standalone.env <<'EOF'
          APP_SECRET=standalone-smoke-secret-0123456789abcdef0123456789abcdef
          PUBLIC_BASE_URL=http://127.0.0.1:8787
          NODE_ENV=production
          DATA_DIR=./data
          DATABASE_PATH=./data/steam-monitor.db
          EOF
          docker run -d --name steam-monitor-standalone \
            --env-file /tmp/standalone.env \
            -p 8787:8787 \
            steam-monitor:standalone
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              echo "standalone health check passed"
              exit 0
            fi
            sleep 3
          done
          echo "standalone health check failed"
          docker logs steam-monitor-standalone
          exit 1

      - name: Remove standalone container
        if: always()
        run: docker rm -f steam-monitor-standalone || true
