name: 功能建议 / Feature request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请先说明使用场景和要解决的问题，而不是只描述实现方式。
        Suggestions are welcome! Please start with the use case and the problem to solve, not only the implementation.

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查 / Before submitting
      options:
        - label: 我已搜索现有 Issue 和文档，确认没有重复或已支持的方案 / I searched existing issues and docs and found no duplicate or existing solution
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关范围 / Related area
      options:
        - 监控与状态检测 / Monitoring and status detection
        - 通知渠道 / Notification channels
        - 指令机器人 / Command bots
        - Web 界面 / Web UI
        - 账号与权限 / Accounts and permissions
        - 管理后台 / Admin
        - Docker / 部署 / Deployment
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 当前流程哪里不方便？希望解决什么问题？ / What is inconvenient today, and what problem should this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
      description: 描述期望的行为或交互 / Describe the behavior or interaction you expect
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      description: 是否尝试过其他做法或临时方案？ / Have you tried other approaches or workarounds?

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 截图、示例配置、相关平台文档链接等 / Screenshots, example configuration, links to platform docs, etc.
